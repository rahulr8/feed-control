<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Feed Control dev X</title>
  <link rel="stylesheet" href="../content.css">
  <style>
    body { margin: 0; background: #000; color: #e7e9ea; font: 15px/20px system-ui, sans-serif; }
    main { width: 600px; margin: 0 auto; border-inline: 1px solid #2f3336; }
    #timeline { position: relative; }
    [data-testid="cellInnerDiv"] > div { border-bottom: 1px solid #2f3336; }
    article { padding: 12px 16px; cursor: pointer; }
    [data-testid="User-Name"] { color: #71767b; } [data-testid="User-Name"] a { color: #71767b; text-decoration: none; } [data-testid="User-Name"] a:first-child { color: #e7e9ea; font-weight: 700; }
    [data-testid="tweetText"] { margin-top: 2px; }
    [data-testid="tweetText"] img { width: 1.1em; height: 1.1em; vertical-align: -3px; }
    div[role="link"] { margin-top: 10px; border: 1px solid #2f3336; border-radius: 16px; padding: 10px 12px; }
    .ad { color: #71767b; font-size: 13px; }
  </style>
</head>
<body>
  <main><div id="timeline"></div></main>
  <script type="module">
    import './stub.js'
    window.FEED_CONTROL_SITE = 'x'
    // Emoji as <img alt>, like X renders them.
    const emoji = e => `<img alt="${e}" src="data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><text y='16' font-size='16'>${e}</text></svg>`)}">`
    const tweet = ({ id, handle, name, text, quote, ad, focused }) => `
      <div data-testid="cellInnerDiv" style="position: absolute; width: 100%; transform: translateY(0px)"><div>
        ${ad ? '<div data-testid="placementTracking">' : ''}
        <article data-testid="tweet" tabindex="${focused ? -1 : 0}" onclick="alert('X would open the tweet')">
          <div data-testid="User-Name"><a href="/${handle}">${name}</a> <a href="/${handle}">@${handle}</a> · <a href="/${handle}/status/${id}"><time datetime="2026-09-22">5h</time></a></div>
          <div data-testid="tweetText">${text}</div>
          ${quote ? `<div role="link" tabindex="0"><div data-testid="User-Name"><a href="/q">Quoted</a></div><div data-testid="tweetText">${quote}</div></div>` : ''}
          ${ad ? '<div class="ad">Ad</div>' : ''}
        </article>
        ${ad ? '</div>' : ''}
      </div></div>`
    timeline.innerHTML = [
      { id: 1005, handle: 'espn', name: 'ESPN', text: 'Tip-off in 30. Who are you riding with tonight?', focused: true },
      { id: 1001, handle: 'priya_dev', name: 'Priya', text: 'Finally fixed the flaky test: it was a timezone bug in our CI runner in Frankfurt.' },
      { id: 1002, handle: 'growthguru', name: 'Growth Guru', text: `${emoji('🚀')} 5 habits that changed my life ${emoji('👇')} 1. Wake up early 2. Journal 3. Hydrate. In conclusion, consistency is key. Thoughts?` },
      { id: 1003, handle: 'nba', name: 'NBA', text: 'Lakers take Game 3 behind a 40-point night.' },
      { id: 1004, handle: 'brand', name: 'Acme Cloud', text: 'Ship 10x faster with Acme Cloud.', ad: true },
      { id: 1006, handle: 'dan', name: 'Dan', text: 'This is exactly right', quote: 'Great breakdown of the Lakers game last night' },
    ].map(tweet).join('')

    // Mimic X's virtualized list: absolute cells, re-laid out when heights change.
    const layout = () => { let y = 0; for (const c of timeline.children) { c.style.transform = `translateY(${y}px)`; y += c.offsetHeight } timeline.style.height = y + 'px' }
    const ro = new ResizeObserver(layout)
    for (const c of timeline.children) ro.observe(c)
    layout()
    document.body.append(Object.assign(document.createElement('script'), { src: '../content.js' }))
  </script>
</body>
</html>
