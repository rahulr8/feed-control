<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Feed Control promo tile</title>
  <style>
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body { display: grid; place-items: center; background: linear-gradient(135deg, #1b1b3a, #3b3b8f); font-family: system-ui, -apple-system, sans-serif; color: #fff; }
    .wrap { display: grid; justify-items: center; gap: 14px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
    h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; }
    p { margin: 0; font-size: 15px; color: #c9caff; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="../icons/128.png" alt="">
    <h1>Feed Control</h1>
    <p>Hide AI slop, ads &amp; any topic</p>
  </div>
</body>
</html>
