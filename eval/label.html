<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feed Control labeler</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafaf9; --card: #fff; --fg: #18181b; --muted: #71717a; --line: #e4e4e7; --accent: #6366f1; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1416; --card: #131f23; --fg: #e4e4e7; --muted: #8ba2ad; --line: #2a3c42; --accent: #818cf8; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { margin: 0; font-size: 17px; }
    progress { width: 100%; height: 4px; accent-color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-height: 220px; }
    .meta { color: var(--muted); font-size: 13px; }
    h2 { margin: 6px 0 8px; font-size: 19px; line-height: 1.3; }
    .body { white-space: pre-wrap; max-height: 40vh; overflow: auto; }
    .labels { display: flex; flex-wrap: wrap; gap: 8px; }
    .labels label { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; user-select: none; }
    .labels label:has(:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); }
    .labels input { accent-color: var(--accent); margin: 0; }
    kbd { font: 11px ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
    nav { display: flex; gap: 8px; align-items: center; }
    button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 550; }
    .spacer { flex: 1; }
    p.hint { margin: 0; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <header><h1>Label posts</h1><span class="meta" id="count"></span></header>
    <progress id="progress" max="1" value="0"></progress>
    <article class="card">
      <div class="meta" id="meta"></div>
      <h2 id="title"></h2>
      <div class="body" id="body"></div>
    </article>
    <div class="labels" id="labels"></div>
    <nav>
      <button id="prev">← Back</button>
      <button class="primary" id="next">Next →</button>
      <span class="spacer"></span>
      <button id="export">Export posts.json</button>
    </nav>
    <p class="hint">Tick every label that applies (none is fine). Next saves the post as labeled. Labels are kept in this browser until you export; save the export over <code>eval/posts.json</code>.</p>
  </main>

  <script type="module">
    import { TOPICS } from './config.js'

    const $ = s => document.querySelector(s)
    const KINDS = [['slop', 'AI slop', 's'], ['promo', 'Ad / self-promo', 'p'], ...TOPICS.map((t, i) => [t, t, String(i + 1)])]
    const posts = await (await fetch('posts.json', { cache: 'no-store' })).json()

    const load = () => { try { return JSON.parse(localStorage.getItem('feed-control-labels') ?? localStorage.getItem('unslop-labels')) ?? {} } catch { return {} } }
    const saved = load()
    for (const p of posts) if (saved[p.id]) p.labels = saved[p.id]
    const persist = () => { try { localStorage.setItem('feed-control-labels', JSON.stringify(Object.fromEntries(posts.filter(p => p.labels).map(p => [p.id, p.labels])))) } catch {} }

    let i = Math.max(0, posts.findIndex(p => !p.labels))
    if (posts.every(p => p.labels)) i = posts.length - 1

    $('#labels').replaceChildren(...KINDS.map(([id, name, key]) => {
      const l = document.createElement('label')
      l.innerHTML = `<input type="checkbox" data-id="${id}"><span></span><kbd>${key}</kbd>`
      l.querySelector('span').textContent = name
      return l
    }))
    const boxes = [...document.querySelectorAll('#labels input')]

    function show() {
      const p = posts[i]
      $('#meta').textContent = [p.subreddit, p.flair, p.link_domain].filter(Boolean).join(' · ')
      $('#title').textContent = p.title
      $('#body').textContent = p.body || '(no body text)'
      const on = new Set(Object.entries(p.labels ?? {}).filter(([, v]) => v).map(([k]) => k))
      boxes.forEach(b => b.checked = on.has(b.dataset.id))
      const done = posts.filter(p => p.labels).length
      $('#count').textContent = `${i + 1} / ${posts.length} · ${done} labeled`
      $('#progress').value = done / posts.length
    }

    function commit() {
      posts[i].labels = Object.fromEntries(boxes.map(b => [b.dataset.id, b.checked]))
      persist()
    }
    const go = d => { commit(); i = Math.min(posts.length - 1, Math.max(0, i + d)); show() }

    $('#next').onclick = () => go(1)
    $('#prev').onclick = () => go(-1)
    $('#export').onclick = () => {
      commit()
      const a = document.createElement('a')
      a.href = URL.createObjectURL(new Blob([JSON.stringify(posts, null, 2)], { type: 'application/json' }))
      a.download = 'posts.json'
      a.click()
    }
    addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return
      const box = boxes[KINDS.findIndex(([, , key]) => key === e.key.toLowerCase())]
      if (box) { box.checked = !box.checked; e.preventDefault() }
      else if (e.key === 'Enter' || e.key === 'ArrowRight') go(1)
      else if (e.key === 'ArrowLeft') go(-1)
    })
    show()
  </script>
</body>
</html>
